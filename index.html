<!DOCTYPE html>
<html>
<head>
  <title>Cat Maze Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>🐱 Cat Goes to Office</h2>
<canvas id="gameCanvas" width="360" height="400"></canvas>
<p class="hint">Swipe on canvas or use buttons for mobile play.</p>
<div id="controls" class="controls">
  <div></div>
  <button id="upBtn" class="control">▲</button>
  <div></div>
  <button id="leftBtn" class="control">◀</button>
  <button id="downBtn" class="control">▼</button>
  <button id="rightBtn" class="control">▶</button>
</div>
<div id="popup" class="popup hidden"></div>
<script src="game.js"></script>
</body>
</html>
